<svg xmlns="http://www.w3.org/2000/svg" width="300" height="52" viewBox="0 0 300 52" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif"><defs></defs><style>.c{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}.fl{transform-box:fill-box;transform-origin:center;animation:fl 3s ease-in-out infinite}.sh{animation:sh 2.6s ease-in-out infinite}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.8s ease-out infinite}@keyframes pop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sh{0%,100%{opacity:1}50%{opacity:.45}}@keyframes pu{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.04,1.25)}}</style><rect x="6" y="6" width="288" height="40" rx="20" fill="#111827" stroke="#34d399" stroke-width="1.5"/><text x="276" y="31.0" font-size="14" font-weight="600" fill="#e5e7eb" text-anchor="end">🌀  Pnömatik ve Valfler  →</text></svg>